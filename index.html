
<!DOCTYPE html>
<html>
<head>
    <title>ICT Club</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        .box {
            background-color: white;
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
        }
    </style>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
</head>

<body>
    <div class="box">
        <h1>ICT Club</h1>
        <p>Check if you are a member!</p>

        <input id="first" placeholder="First Name">
        <br>
        <input id="last" placeholder="Last Name">
        <br><br>

        <button py-click="check">Check Name</button>

        <p id="result">Result will show here</p>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
